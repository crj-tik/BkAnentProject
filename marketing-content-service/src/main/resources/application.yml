server:
  port: 9008

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: marketing-content-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

service:
  identity:
    key-id: ${SERVICE_IDENTITY_KEY_ID:marketing-content-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

a2a:
  memory:
    enabled: ${MARKETING_MEMORY_V2_ENABLED:false}
    read-enabled: true
    delivery-enabled: true
    compression-enabled: ${MARKETING_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:marketing-content-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}

dubbo:
  application:
    name: marketing-content-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22518                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20888
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}
  consumer:
    protocol: dubbo

marketing:
  listing-read:
    key-id: ${MARKETING_LISTING_READ_KEY_ID:marketing-read-current}
    signing-secret: ${MARKETING_LISTING_READ_SECRET:}
