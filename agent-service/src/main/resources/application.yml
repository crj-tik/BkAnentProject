server:
  port: 9002

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: agent-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

service:
  identity:
    key-id: ${SERVICE_IDENTITY_KEY_ID:agent-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

a2a:
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}

agent:
  authorization:
    enabled: ${AGENT_AUTHORIZATION_ENABLED:false}
    caller-service: agent-service
    key-id: ${SERVICE_IDENTITY_KEY_ID:agent-service-current}
    private-key-path: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
    public-key: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
    audience: agent-service
    authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
    cache-entries: 1000
    cache-bytes: 16777216
    max-users: 1000
    max-sessions: 4000
    max-sessions-per-user: 32
    capability-permissions:
      "local:milvusKnowledgeSearch": agent.rag.search
    mcp-target-audiences:
      business-mcp-server: business-service
      compare-mcp-server: compare-engine-service
      marketing-mcp-server: marketing-content-service
      contract-mcp-server: contract-service
      settlement-mcp-server: settlement-service
      notification-mcp-server: notification-service
      media-mcp-server: media-worker-service
      interview-mcp-server: interview-service
    public-mcp-capabilities: []
    redis:
      protected-reader-configured: ${AUTHZ_REDIS_READER_CONFIGURED:false}
      host: ${AUTHZ_REDIS_HOST:${REDIS_HOST:127.0.0.1}}
      port: ${AUTHZ_REDIS_PORT:6380}
      username: agent-authz-reader
      password: ${AUTHZ_REDIS_READER_PASSWORD:}
      tls: ${AUTHZ_REDIS_TLS:true}
      namespace: authz
      channel: authz:versions
  memory-v2:
    compression-enabled: ${AGENT_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:agent-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
    cache-entries: ${AGENT_MEMORY_V2_CACHE_ENTRIES:128}
    cache-bytes: ${AGENT_MEMORY_V2_CACHE_BYTES:33554432}
    cache-ttl-ms: ${AGENT_MEMORY_V2_CACHE_TTL_MS:60000}
    soft-tokens: ${AGENT_MEMORY_V2_SOFT_TOKENS:8000}
    hard-tokens: ${AGENT_MEMORY_V2_HARD_TOKENS:12000}
    recent-messages: ${AGENT_MEMORY_V2_RECENT_MESSAGES:12}
    summary-timeout-ms: ${AGENT_MEMORY_V2_SUMMARY_TIMEOUT_MS:5000}
    cleanup-ms: ${AGENT_MEMORY_V2_CLEANUP_MS:30000}
    tool-inline-chars: ${AGENT_MEMORY_V2_TOOL_INLINE_CHARS:4096}
    recall-chars: ${AGENT_MEMORY_V2_RECALL_CHARS:8192}
    preference-budget-tokens: ${AGENT_MEMORY_V2_PREFERENCE_BUDGET_TOKENS:800}
    experience-budget-tokens: ${AGENT_MEMORY_V2_EXPERIENCE_BUDGET_TOKENS:512}

dubbo:
  application:
    name: agent-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22510                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}
  consumer:
    protocol: dubbo
