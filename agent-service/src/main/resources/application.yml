server:
  port: 9002

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: agent-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

service:
  identity:
    key-id: ${SERVICE_IDENTITY_KEY_ID:agent-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

a2a:
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}

agent:
  memory-v2:
    enabled: ${AGENT_MEMORY_V2_ENABLED:false}
    read-enabled: true
    delivery-enabled: true
    compression-enabled: ${AGENT_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:agent-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
    cache-entries: ${AGENT_MEMORY_V2_CACHE_ENTRIES:128}
    cache-bytes: ${AGENT_MEMORY_V2_CACHE_BYTES:33554432}
    cache-ttl-ms: ${AGENT_MEMORY_V2_CACHE_TTL_MS:60000}
    soft-tokens: ${AGENT_MEMORY_V2_SOFT_TOKENS:8000}
    hard-tokens: ${AGENT_MEMORY_V2_HARD_TOKENS:12000}
    recent-messages: ${AGENT_MEMORY_V2_RECENT_MESSAGES:12}
    summary-timeout-ms: ${AGENT_MEMORY_V2_SUMMARY_TIMEOUT_MS:5000}
    cleanup-ms: ${AGENT_MEMORY_V2_CLEANUP_MS:30000}
    tool-inline-chars: ${AGENT_MEMORY_V2_TOOL_INLINE_CHARS:4096}
    recall-chars: ${AGENT_MEMORY_V2_RECALL_CHARS:8192}
    preference-budget-tokens: ${AGENT_MEMORY_V2_PREFERENCE_BUDGET_TOKENS:800}
    experience-budget-tokens: ${AGENT_MEMORY_V2_EXPERIENCE_BUDGET_TOKENS:512}

dubbo:
  application:
    name: agent-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22510                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}
  consumer:
    protocol: dubbo
