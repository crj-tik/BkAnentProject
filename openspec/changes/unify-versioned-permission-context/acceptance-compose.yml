      timeout: 3s
      retries: 40
      start_period: 15s
    mem_limit: 768m
    cpus: "1"
    networks: [isolated]
  redis:
    image: sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    pull_policy: never
    restart: "no"
    command: ["redis-server", "/run/secrets/redis.conf"]
    tmpfs:
      - /data:rw,size=64m
    volumes:
      - D:/tmp/bk-anent-authz-check-20261023-secrets/redis.acl:/run/secrets/redis.acl:ro
      - D:/tmp/bk-anent-authz-check-20261023-secrets/redis.conf:/run/secrets/redis.conf:ro
