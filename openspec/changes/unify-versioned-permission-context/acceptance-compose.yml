# Synthetic-only acceptance; no development networks, data, or published ports.
name: bk-anent-authz-check-20261023
services:
  mysql:
    image: sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    pull_policy: never
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root.txt
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-log-bin"]
    tmpfs:
      - /var/lib/mysql:rw,size=512m
    volumes:
      - D:/tmp/bk-anent-authz-check-20261023-secrets/root.txt:/run/secrets/root.txt:ro
      - D:/tmp/bk-anent-authz-check-20261023-secrets/root.cnf:/run/secrets/root.cnf:ro
      - D:/tmp/bk-anent-authz-check-20261023-secrets/migration.cnf:/run/secrets/migration.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "cp /run/secrets/root.cnf /tmp/health.cnf && chmod 600 /tmp/health.cnf && mysql --defaults-extra-file=/tmp/health.cnf --silent -e 'SELECT 1' >/dev/null"]
