spring:
  data:
    redis:
      host: ${REDIS_HOST:10.117.102.54}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_AUTH:bk_auth}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

auth:
  authorization:
    enabled: ${AUTH_AUTHORIZATION_ENABLED:false}
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
    trusted-callers:
      gateway-current:
        service: gateway
        public-key: ${GATEWAY_IDENTITY_PUBLIC_KEY:}
        operations: [RESOLVE_REQUEST_AUTHORIZATION]
        audiences: [auth-service, agent-service, interview-service, platform-operations-service]
    redis:
      enabled: ${AUTH_AUTHORIZATION_REDIS_ENABLED:false}
      protected-writer-configured: ${AUTHZ_REDIS_WRITER_CONFIGURED:false}
      namespace: authz
      channel: authz:versions
      host: ${AUTHZ_REDIS_HOST:${REDIS_HOST:10.117.102.54}}
      port: ${AUTHZ_REDIS_PORT:6380}
      username: authz-writer
      password: ${AUTHZ_REDIS_WRITER_PASSWORD:}
      tls: ${AUTHZ_REDIS_TLS:true}
  rag:
    rpc:
      trusted-keys:
        rag-current:
          caller-service: rag-service
          secret: ${RAG_AUTH_RPC_SECRET:}
        listing-current:
          caller-service: listing-master-service
          secret: ${LISTING_RAG_RPC_SECRET:}
        memory-current:
          caller-service: memory-service
          secret: ${MEMORY_RAG_RPC_SECRET:}
        agent-current:
          caller-service: agent-service
          secret: ${AGENT_RAG_RPC_SECRET:}
      response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
      response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
  a2a:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
    trusted-identities:
      agent-service-current:
        caller-service: agent-service
        public-key: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [ISSUE_BEACON]
      listing-master-service-current:
        caller-service: listing-master-service
        public-key: ${LISTING_MASTER_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      customer-service-current:
        caller-service: customer-service
        public-key: ${CUSTOMER_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      marketing-content-service-current:
        caller-service: marketing-content-service
        public-key: ${MARKETING_CONTENT_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      platform-operations-service-current:
        caller-service: platform-operations-service
        public-key: ${PLATFORM_OPERATIONS_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      business-service-current:
        caller-service: business-service
        public-key: ${BUSINESS_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      knowledge-service-current:
        caller-service: knowledge-service
        public-key: ${KNOWLEDGE_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      business-review-service-current:
        caller-service: business-review-service
        public-key: ${BUSINESS_REVIEW_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      notification-service-current:
        caller-service: notification-service
        public-key: ${NOTIFICATION_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      media-worker-service-current:
        caller-service: media-worker-service
        public-key: ${MEDIA_WORKER_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
      interview-service-current:
        caller-service: interview-service
        public-key: ${INTERVIEW_SERVICE_IDENTITY_PUBLIC_KEY:}
        allowed-operations: [RESOLVE_BEACON]
  token:
    secret: ${AUTH_TOKEN_SECRET:}
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 604800
    allow-random-secret: false
    revocation:
      provider: redis
      key-prefix: "auth:token:revoked:"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database,redis}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"
      database: "${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}"
      redis: "${REDIS_HOST:10.117.102.54}:${REDIS_PORT:6379}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
