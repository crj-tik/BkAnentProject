spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB_AUTH:bk_auth}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

auth:
  token:
    secret: ${AUTH_TOKEN_SECRET:}
    access-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:604800}
    allow-random-secret: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database}
    endpoints:
      nacos: "${NACOS_SERVER:127.0.0.1:8080}"
      database: "${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
