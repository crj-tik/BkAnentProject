spring:
  data:
    redis:
      host: ${REDIS_HOST:10.117.102.54}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_AUTH:bk_auth}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

auth:
  rag:
    rpc:
      trusted-keys:
        rag-current:
          caller-service: rag-service
          secret: ${RAG_AUTH_RPC_SECRET:}
        listing-current:
          caller-service: listing-master-service
          secret: ${LISTING_RAG_RPC_SECRET:}
        memory-current:
          caller-service: memory-service
          secret: ${MEMORY_RAG_RPC_SECRET:}
        agent-a2a-current:
          caller-service: agent-service
          secret: ${AGENT_A2A_SIGNING_SECRET:}
        listing-a2a-current:
          caller-service: listing-master-service
          secret: ${LISTING_A2A_SIGNING_SECRET:}
        customer-a2a-current:
          caller-service: customer-service
          secret: ${CUSTOMER_A2A_SIGNING_SECRET:}
        marketing-a2a-current:
          caller-service: marketing-content-service
          secret: ${MARKETING_A2A_SIGNING_SECRET:}
        business-a2a-current:
          caller-service: business-service
          secret: ${BUSINESS_A2A_SIGNING_SECRET:}
        compare-a2a-current:
          caller-service: compare-engine-service
          secret: ${COMPARE_A2A_SIGNING_SECRET:}
        contract-a2a-current:
          caller-service: contract-service
          secret: ${CONTRACT_A2A_SIGNING_SECRET:}
        settlement-a2a-current:
          caller-service: settlement-service
          secret: ${SETTLEMENT_A2A_SIGNING_SECRET:}
        notification-a2a-current:
          caller-service: notification-service
          secret: ${NOTIFICATION_A2A_SIGNING_SECRET:}
        media-a2a-current:
          caller-service: media-worker-service
          secret: ${MEDIA_A2A_SIGNING_SECRET:}
        interview-a2a-current:
          caller-service: interview-service
          secret: ${INTERVIEW_A2A_SIGNING_SECRET:}
      response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
      response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
  token:
    secret: ${AUTH_TOKEN_SECRET:}
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 604800
    allow-random-secret: false
    revocation:
      provider: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database,redis}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"
      database: "${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}"
      redis: "${REDIS_HOST:10.117.102.54}:${REDIS_PORT:6379}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
