spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB_BUSINESS_REVIEW:bk_business_review}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
      base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
      chat:
        api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
        base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
        completions-path: /chat/completions
        options:
          model: ${BUSINESS_REVIEW_AGENT_MODEL:gpt-5.6-terra}
          temperature: 0.2
    alibaba:
      a2a:
        server:
          enabled: true
          message-url: /a2a
          agent-card-url: /.well-known/agent.json
          card:
            name: business-review-agent
            description: Drafts evidence-backed store reviews for explicit user confirmation
            version: 1.0.0
            url: ${A2A_PUBLIC_BASE_URL:http://business-review-service:9016}
            default-input-modes: text,application/json
            default-output-modes: text,application/json
            capabilities:
              streaming: true
              push-notifications: false
              state-transition-history: true
        nacos:
          server-addr: ${NACOS_SERVER:127.0.0.1:8848}
          namespace: ${NACOS_NAMESPACE:}
          username: ${NACOS_USERNAME:}
          password: ${NACOS_PASSWORD:}
          registry:
            enabled: true
          discovery:
            enabled: true
  cloud:
    nacos:
      discovery:
        metadata:
          agent-id: business-review-agent
          agent-domains: business-review
          agent-runtime-provider: official
          agent-card-path: /.well-known/agent.json
          a2a-path: /a2a

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database}
    endpoints:
      nacos: ${NACOS_SERVER:127.0.0.1:8848}
      database: ${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}

a2a:
  memory:
    compression-enabled: ${BUSINESS_REVIEW_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:business-review-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
  execution:
    stream-timeout-ms: 300000

agent:
  a2a:
    authorization:
      enabled: ${BUSINESS_REVIEW_A2A_AUTHORIZATION_ENABLED:true}
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
      trusted-caller-public-keys:
        agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}

business-review:
  authorization:
    enabled: ${BUSINESS_REVIEW_AUTHORIZATION_ENABLED:true}
    audience: business-review-service
    max-body-bytes: 1048576
    authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  sources:
    mode: ${BUSINESS_REVIEW_SOURCE_MODE:http}
    listing-base-url: ${BUSINESS_REVIEW_LISTING_BASE_URL:http://listing-master-service:9003}
    knowledge-base-url: ${BUSINESS_REVIEW_KNOWLEDGE_BASE_URL:http://knowledge-service:9015}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  agent:
    system-prompt: |
      你是门店经营复盘助手。只依据 Memory 已授权上下文和明确提供的来源事实形成待审核草稿。
      将事实、假设、资料缺口和建议动作分开表达；缺少客户反馈或价格依据时明确说明，不得补造。
      不得确认计划、回写动作、改变房源/客户/成交状态或宣称业绩因果增长。所有动作由用户通过业务 API 明确触发。

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

mcp:
  authorization:
    server:
      enabled: false
      caller-service: agent-service
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
      caller-public-keys:
        agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
      tool-operations: {}
      public-tools: []

dubbo:
  application:
    name: business-review-service
    qos-enable: false
  protocol:
    name: dubbo
    port: -1
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://${NACOS_SERVER:127.0.0.1:8848}?namespace=${NACOS_NAMESPACE:}}
  consumer:
    protocol: dubbo
