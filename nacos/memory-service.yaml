spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_MEMORY:bk_memory}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

memory:
  v2:
    sharing:
      enabled: ${MEMORY_V2_SHARING_ENABLED:false}
      max-export-utf8-bytes: ${MEMORY_V2_SHARING_MAX_EXPORT_UTF8_BYTES:24576}
    current-user-permission: ${MEMORY_V2_USER_PERMISSION:agent.chat.use}
    authorization-context-enabled: ${MEMORY_V2_AUTHORIZATION_CONTEXT_ENABLED:false}
    authz-authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
    experience-governance-permission: ${MEMORY_V2_EXPERIENCE_GOVERNANCE_PERMISSION:memory.experience.governance.publish}
    replay-cleanup-ms: ${MEMORY_V2_REPLAY_CLEANUP_MS:60000}
    privacy-cleanup:
      poll-ms: ${MEMORY_V2_PRIVACY_CLEANUP_POLL_MS:5000}
      batch-size: ${MEMORY_V2_PRIVACY_CLEANUP_BATCH_SIZE:8}
      max-attempts: ${MEMORY_V2_PRIVACY_CLEANUP_MAX_ATTEMPTS:8}
      lease-seconds: ${MEMORY_V2_PRIVACY_CLEANUP_LEASE_SECONDS:60}
      retry-seconds: ${MEMORY_V2_PRIVACY_CLEANUP_RETRY_SECONDS:15}
    # Exact caller/domain/agent grants. Memory v2 requests use verifier-only Ed25519 public keys.
    trusted-callers:
      agent-service:
        public-keys:
          agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        allowed-agents-by-domain:
          supervisor: [supervisor-agent]
      marketing-content-service:
        public-keys:
          marketing-content-service-current: ${MARKETING_CONTENT_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        experience-outcome-publisher: ${MARKETING_MEMORY_EXPERIENCE_OUTCOME_PUBLISHER:false}
        experience-governance-publisher: ${MARKETING_MEMORY_EXPERIENCE_GOVERNANCE_PUBLISHER:false}
        allowed-agents-by-domain:
          marketing: [marketing-agent]
      interview-service:
        public-keys:
          interview-service-current: ${INTERVIEW_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        experience-outcome-publisher: ${INTERVIEW_MEMORY_EXPERIENCE_OUTCOME_PUBLISHER:false}
        experience-governance-publisher: ${INTERVIEW_MEMORY_EXPERIENCE_GOVERNANCE_PUBLISHER:false}
        allowed-agents-by-domain:
          interview: [interview-agent]
      knowledge-service:
        public-keys:
          knowledge-service-current: ${KNOWLEDGE_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        allowed-agents-by-domain:
          knowledge: [knowledge-agent]
      listing-master-service:
        public-keys:
          listing-master-service-current: ${LISTING_MASTER_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        experience-outcome-publisher: ${LISTING_MEMORY_EXPERIENCE_OUTCOME_PUBLISHER:false}
        experience-governance-publisher: ${LISTING_MEMORY_EXPERIENCE_GOVERNANCE_PUBLISHER:false}
        allowed-agents-by-domain:
          listing: [listing-agent]
      business-service:
        public-keys:
          business-service-current: ${BUSINESS_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        experience-outcome-publisher: ${BUSINESS_MEMORY_EXPERIENCE_OUTCOME_PUBLISHER:false}
        experience-governance-publisher: ${BUSINESS_MEMORY_EXPERIENCE_GOVERNANCE_PUBLISHER:false}
        allowed-agents-by-domain:
          trade: [trade-agent]
      business-review-service:
        public-keys:
          business-review-service-current: ${BUSINESS_REVIEW_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        experience-outcome-publisher: false
        allowed-agents-by-domain:
          business-review: [business-review-agent]
      contract-service:
        public-keys:
          contract-service-current: ${CONTRACT_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        experience-outcome-publisher: ${CONTRACT_MEMORY_EXPERIENCE_OUTCOME_PUBLISHER:false}
        experience-governance-publisher: ${CONTRACT_MEMORY_EXPERIENCE_GOVERNANCE_PUBLISHER:false}
        allowed-agents-by-domain:
          contract: [contract-agent]
      settlement-service:
        public-keys:
          settlement-service-current: ${SETTLEMENT_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        experience-outcome-publisher: ${SETTLEMENT_MEMORY_EXPERIENCE_OUTCOME_PUBLISHER:false}
        experience-governance-publisher: ${SETTLEMENT_MEMORY_EXPERIENCE_GOVERNANCE_PUBLISHER:false}
        allowed-agents-by-domain:
          settlement: [settlement-agent]
      notification-service:
        public-keys:
          notification-service-current: ${NOTIFICATION_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        allowed-agents-by-domain:
          notification: [notification-agent]
      media-worker-service:
        public-keys:
          media-worker-service-current: ${MEDIA_WORKER_SERVICE_IDENTITY_PUBLIC_KEY:}
        service-delivery: true
        allowed-agents-by-domain:
          media: [media-agent]
    preference:
      dimensions: [budget, commute_time, floor, copy_length, bedrooms, area, location, style]
      half-life-days: 180
      aliases:
        budget: ["budget", "price", "price range", "purchase price", "total price", "预算", "总价", "价格", "首付"]
        commute_time: ["commute", "commute time", "transport", "subway", "通勤", "交通", "地铁", "公交", "距离"]
        floor: ["floor", "elevator", "楼层", "电梯", "低楼层", "高楼层"]
        copy_length: ["copy length", "description length", "文案长度", "篇幅"]
        bedrooms: ["bedrooms", "bedroom", "rooms", "户型", "卧室", "几室"]
        area: ["area", "floor area", "size", "面积", "平米", "平方米"]
        location: ["location", "district", "neighborhood", "地段", "区域", "位置", "商圈"]
        style: ["style", "decoration", "装修风格", "风格", "装修"]
      processing:
        enabled: ${MEMORY_V2_PREFERENCE_PROCESSING_ENABLED:false}
        mode: ${MEMORY_V2_PREFERENCE_PROCESSING_MODE:SHADOW}
        model: ${MEMORY_V2_PREFERENCE_MODEL:}
        poll-ms: 5000
        batch-size: 4
        max-attempts: 4
        lease-seconds: 90
        retry-seconds: 30
        # Explicit SERVICE processing registration; no domain is implicitly authorized.
        allowed-agents-by-domain: {}
    experience:
      enabled: ${MEMORY_V2_EXPERIENCE_ENABLED:false}
      processing-enabled: ${MEMORY_V2_EXPERIENCE_PROCESSING_ENABLED:false}
      poll-ms: ${MEMORY_V2_EXPERIENCE_POLL_MS:5000}
      batch-size: ${MEMORY_V2_EXPERIENCE_BATCH_SIZE:4}
      max-attempts: ${MEMORY_V2_EXPERIENCE_MAX_ATTEMPTS:4}
      lease-seconds: ${MEMORY_V2_EXPERIENCE_LEASE_SECONDS:90}
      retry-seconds: ${MEMORY_V2_EXPERIENCE_RETRY_SECONDS:30}
      max-candidates: ${MEMORY_V2_EXPERIENCE_MAX_CANDIDATES:128}
      max-token-budget: ${MEMORY_V2_EXPERIENCE_MAX_TOKEN_BUDGET:2048}
      half-life-days: ${MEMORY_V2_EXPERIENCE_HALF_LIFE_DAYS:180}
  rag:
    versioned-authorization-required: false
    key-id: memory-current
    signing-secret: ${MEMORY_RAG_RPC_SECRET:}
    auth-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
    auth-signing-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
    trusted-callers:
      agent-current:
        caller-service: agent-service
        secret: ${AGENT_RAG_RPC_SECRET:}
    policy-version: memory-v1
    constraint-read-roles: [ADMIN, BROKER]
    constraint-admin-roles: [ADMIN]
    # LR-43: deploy only the exact verified scoringVersion; missing registration fails closed.
    semantic-scoring-versions: ${MEMORY_RAG_SEMANTIC_SCORING_VERSIONS:}
    dispatcher-enabled: ${MEMORY_RAG_DISPATCHER_ENABLED:false}
    domain-projection-enabled: ${MEMORY_RAG_DOMAIN_PROJECTION_ENABLED:false}
    domain-search-enabled: ${MEMORY_RAG_DOMAIN_SEARCH_ENABLED:false}
    candidate-authorization-key-id: ${RAG_MEMORY_CANDIDATE_KEY_ID:rag-memory-candidate-current}
    candidate-authorization-secret: ${RAG_MEMORY_CANDIDATE_KEY_SECRET:}
    dispatch-batch-size: 25
    max-attempts: 5
    retry-delay-ms: 1000
  system-constraint-bootstrap:
    enabled: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"
      database: "${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}"
