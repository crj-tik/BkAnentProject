spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_AGENT:bk_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    deepseek:
      # KE OpenAI-compatible gateway (Bella). DeepSeek starter drives all chat traffic.
      api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
      base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
      chat:
        api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
        base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
        completions-path: /chat/completions
        options:
          model: ${AGENT_CHAT_MODEL:${AGENT_DEEPSEEK_MODEL:gpt-5.6-terra}}
          temperature: 0.2
    model:
      chat: deepseek
    alibaba:
      a2a:
        nacos:
          server-addr: ${NACOS_SERVER:10.117.102.54:8848}
          namespace: ${NACOS_NAMESPACE:}
          username: ${NACOS_USERNAME:}
          password: ${NACOS_PASSWORD:}
          registry:
            enabled: false
          discovery:
            enabled: true
    mcp:
      client:
        request-timeout: ${AGENT_MCP_REQUEST_TIMEOUT:30s}
        initialization-timeout: ${AGENT_MCP_INITIALIZATION_TIMEOUT:20s}
        connections:
          business-mcp-server:
            url: ${BUSINESS_MCP_ENDPOINT:http://10.117.102.54:9010/mcp}
            type: STREAMABLE
          compare-mcp-server:
            url: ${COMPARE_MCP_ENDPOINT:http://10.117.102.54:9006/mcp}
            type: STREAMABLE
          marketing-mcp-server:
            url: ${MARKETING_MCP_ENDPOINT:http://10.117.102.54:9008/mcp}
            type: STREAMABLE
          contract-mcp-server:
            url: ${CONTRACT_MCP_ENDPOINT:http://10.117.102.54:9012/mcp}
            type: STREAMABLE
          settlement-mcp-server:
            url: ${SETTLEMENT_MCP_ENDPOINT:http://10.117.102.54:9013/mcp}
            type: STREAMABLE
          notification-mcp-server:
            url: ${NOTIFICATION_MCP_ENDPOINT:http://10.117.102.54:9003/mcp}
            type: STREAMABLE
          media-mcp-server:
            url: ${MEDIA_MCP_ENDPOINT:http://10.117.102.54:9007/mcp}
            type: STREAMABLE
          interview-mcp-server:
            url: ${INTERVIEW_MCP_ENDPOINT:http://10.117.102.54:9014/mcp}
            type: STREAMABLE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database,redis,rocketmq,memory}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"
      database: "${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}"
      redis: "${REDIS_HOST:10.117.102.54}:${REDIS_PORT:6379}"
      rocketmq: "${ROCKETMQ_NAME_SERVER:10.117.102.54:9876}"
      memory: "${MEMORY_SERVICE_BASE_URL:http://10.117.102.54:9011}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

a2a:
  auth:
    key-id: ${AGENT_A2A_KEY_ID:agent-a2a-current}
    signing-secret: ${AGENT_A2A_SIGNING_SECRET:}
    response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
    response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}

agent:
  skills:
    external-dir: ${AGENT_SKILLS_EXTERNAL_DIR:}
    watch-enabled: ${AGENT_SKILLS_WATCH_ENABLED:true}
  memory:
    base-url: ${MEMORY_SERVICE_BASE_URL:http://10.117.102.54:9011}
  chat:
    model: ${AGENT_CHAT_MODEL:${AGENT_DEEPSEEK_MODEL:gpt-5.6-terra}}
    temperature: ${AGENT_CHAT_TEMPERATURE:${AGENT_DEEPSEEK_TEMPERATURE:0.2}}
    max-tokens: ${AGENT_CHAT_MAX_TOKENS:${AGENT_DEEPSEEK_MAX_TOKENS:4000}}
    top-p: ${AGENT_CHAT_TOP_P:${AGENT_DEEPSEEK_TOP_P:1.0}}
    default-top-k: ${AGENT_CHAT_DEFAULT_TOP_K:${AGENT_DEEPSEEK_DEFAULT_TOP_K:4}}
    system-prompt: ${AGENT_CHAT_SYSTEM_PROMPT:${AGENT_DEEPSEEK_SYSTEM_PROMPT:}}
  rag-consumer:
    knowledge-enabled: false
    supervisor-owner-confirmed: false
    supervisor-owner-domain: agent-service
    supervisor-policy-version: ""
    supervisor-read-user-ids: []
    key-id: agent-current
    signing-secret: ${AGENT_RAG_RPC_SECRET:}
    credential-lease-seconds: 300
    max-credential-leases: 1000
    keyword-top-k: 20
    vector-top-k: 20
    final-top-k: 10
    # Physical targets and embedding/rerank execution belong exclusively to RAG.
  distributed:
    supervisor-agent-id: ${SUPERVISOR_AGENT_ID:supervisor-agent}
    refresh-interval-seconds: ${AGENT_DISCOVERY_REFRESH_INTERVAL_SECONDS:30}
    catalog:
      strict-nacos: ${AGENT_CATALOG_STRICT_NACOS:true}
    rate-limit:
      enabled: ${AGENT_RATE_LIMIT_ENABLED:true}
      provider: ${AGENT_RATE_LIMIT_PROVIDER:memory}
      window-seconds: ${AGENT_RATE_LIMIT_WINDOW_SECONDS:60}
      default-per-window: ${AGENT_RATE_LIMIT_DEFAULT_PER_WINDOW:200}
      supervisor-tasks-per-window: ${AGENT_RATE_LIMIT_SUPERVISOR_TASKS_PER_WINDOW:200}
      supervisor-async-tasks-per-window: ${AGENT_RATE_LIMIT_SUPERVISOR_ASYNC_TASKS_PER_WINDOW:120}
      supervisor-workflows-per-window: ${AGENT_RATE_LIMIT_SUPERVISOR_WORKFLOWS_PER_WINDOW:100}
      supervisor-async-workflows-per-window: ${AGENT_RATE_LIMIT_SUPERVISOR_ASYNC_WORKFLOWS_PER_WINDOW:60}
    gray-release:
      # v2 迁移已完成，默认不启用灰度；需要时经治理 API 动态开启（代码能力保留）。
      enabled: false
      strategy-version: "v2"
      prefer-async-a2a: false
      user-ids: []
      domains: {}
    event-audit:
      max-active-events: ${AGENT_EVENT_AUDIT_MAX_ACTIVE_EVENTS:5000}
      archive-enabled: ${AGENT_EVENT_AUDIT_ARCHIVE_ENABLED:true}
      max-archived-events: ${AGENT_EVENT_AUDIT_MAX_ARCHIVED_EVENTS:10000}
      retention-seconds: ${AGENT_EVENT_AUDIT_RETENTION_SECONDS:86400}
    streaming:
      enabled: ${AGENT_SUPERVISOR_STREAMING_ENABLED:true}
      max-delta-chars: ${AGENT_SUPERVISOR_STREAMING_MAX_DELTA_CHARS:4096}
      max-delta-events-per-second: ${AGENT_SUPERVISOR_STREAMING_MAX_DELTA_EVENTS_PER_SECOND:50}
      max-metadata-chars: ${AGENT_SUPERVISOR_STREAMING_MAX_METADATA_CHARS:4096}
    async-runtime:
      enabled: ${AGENT_ASYNC_RUNTIME_ENABLED:true}
      dispatch-interval-ms: ${AGENT_ASYNC_RUNTIME_DISPATCH_INTERVAL_MS:1000}
      dispatch-batch-size: ${AGENT_ASYNC_RUNTIME_DISPATCH_BATCH_SIZE:10}
      max-concurrency: ${AGENT_ASYNC_RUNTIME_MAX_CONCURRENCY:16}
      queue-capacity: ${AGENT_ASYNC_RUNTIME_QUEUE_CAPACITY:128}
      lease-timeout-seconds: ${AGENT_ASYNC_RUNTIME_LEASE_TIMEOUT_SECONDS:600}
      max-attempts: ${AGENT_ASYNC_RUNTIME_MAX_ATTEMPTS:3}
      retry-delay-seconds: ${AGENT_ASYNC_RUNTIME_RETRY_DELAY_SECONDS:5}
      child-task-submit-request-timeout-ms: ${AGENT_A2A_CHILD_TASK_SUBMIT_REQUEST_TIMEOUT_MS:15000}
      child-task-timeout-ms: ${AGENT_A2A_CHILD_TASK_TIMEOUT_MS:1800000}
      child-task-poll-request-timeout-ms: ${AGENT_A2A_CHILD_TASK_POLL_REQUEST_TIMEOUT_MS:15000}
      child-task-initial-poll-interval-ms: ${AGENT_A2A_CHILD_TASK_INITIAL_POLL_INTERVAL_MS:1000}
      child-task-max-poll-interval-ms: ${AGENT_A2A_CHILD_TASK_MAX_POLL_INTERVAL_MS:10000}
      child-task-poll-backoff-multiplier: ${AGENT_A2A_CHILD_TASK_POLL_BACKOFF_MULTIPLIER:1.5}
      child-task-poll-jitter-percent: ${AGENT_A2A_CHILD_TASK_POLL_JITTER_PERCENT:20}
      worker-id: ${AGENT_ASYNC_RUNTIME_WORKER_ID:agent-worker}
    stream:
      provider: rocketmq
      rocketmq:
        topic: ${AGENT_STREAM_ROCKETMQ_TOPIC:bk-agent-session-stream}
        consumer-group: ${AGENT_STREAM_ROCKETMQ_CONSUMER_GROUP:agent-service-session-stream}
        producer-group: ${AGENT_STREAM_ROCKETMQ_PRODUCER_GROUP:agent-service-session-stream-producer}
    discovery-enabled: ${AGENT_DISCOVERY_ENABLED:true}
    agent-card-path: ${AGENT_CARD_PATH:/.well-known/agent.json}
    agents: {}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:10.117.102.54:9876}
  producer:
    group: ${AGENT_STREAM_ROCKETMQ_PRODUCER_GROUP:agent-service-session-stream-producer}
