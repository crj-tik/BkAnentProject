spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: auth-service
            uri: "${AUTH_ROUTE_URI:lb://auth-service}"
            predicates:
              - Path=/auth/**
          - id: agent-service
            uri: lb://agent-service
            predicates:
              - Path=/agent/**
          - id: listing-master-service
            uri: lb://listing-master-service
            predicates:
              - Path=/listings/**
          - id: customer-service
            uri: lb://customer-service
            predicates:
              - Path=/customers/**
          - id: business-service
            uri: lb://business-service
            predicates:
              - Path=/business/**
          - id: platform-operations-service
            uri: lb://platform-operations-service
            predicates:
              - Path=/platform-operations/**
          - id: business-review-service
            uri: lb://business-review-service
            predicates:
              - Path=/business-review/**
          - id: listing-comparison-compatibility
            uri: lb://listing-master-service
            predicates:
              - Path=/compare/**
          - id: contract-service
            uri: lb://contract-service
            predicates:
              - Path=/contracts/**
          - id: settlement-service
            uri: lb://settlement-service
            predicates:
              - Path=/settlements/**
          - id: marketing-promotion-compat
            uri: lb://marketing-content-service
            predicates:
              - Path=/promotions/**
          - id: marketing-content-service
            uri: lb://marketing-content-service
            predicates:
              - Path=/marketing/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/notifications/**
          - id: interview-service
            uri: lb://interview-service
            predicates:
              - Path=/interviews/**
          - id: knowledge-service
            uri: lb://knowledge-service
            predicates:
              - Path=/knowledge/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"

gateway:
  authorization:
    enabled: ${GATEWAY_AUTHORIZATION_ENABLED:false}
    max-body-bytes: ${GATEWAY_AUTHORIZATION_MAX_BODY_BYTES:1048576}
    caller-service: gateway
    key-id: ${GATEWAY_AUTHORIZATION_KEY_ID:gateway-current}
    private-key-path: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
    authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
    # Each route maps to its exact signed-service audience; unmapped routes fail closed.
    route-audiences:
      auth-service: auth-service
      agent-service: agent-service
      knowledge-service: knowledge-service
      interview-service: interview-service
      business-review-service: business-review-service
      platform-operations-service: platform-operations-service
  access:
    whitelist-prefixes:
      - /auth/login
      - /auth/logout
      - /auth/health
      - /actuator
      - /gateway/health
  cors:
    allowed-origin-patterns:
      - "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: false
    max-age: 3600
  rate-limit:
    enabled: true
    requests-per-window: 100
    window-seconds: 60
    path-limits:
      /agent/supervisor/tasks: 60
      /agent/supervisor/tasks/async: 40
      /agent/supervisor/workflows: 30
      /agent/supervisor/workflows/async: 20
