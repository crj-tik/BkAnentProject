spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_LISTING:bk_listing}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    deepseek:
      # KE OpenAI-compatible gateway (Bella). DeepSeek starter drives chat traffic.
      api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
      base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
      chat:
        api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
        base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
        completions-path: /chat/completions
        options:
          model: ${LISTING_AGENT_MODEL:gpt-5.6-terra}
          temperature: 0.2
    alibaba:
      a2a:
        server:
          enabled: true
          message-url: /a2a
          agent-card-url: /.well-known/agent.json
          card:
            name: listing-agent
            description: authorized listing search, recommendation, version-bound comparison and summary agent
            version: 1.0.0
            url: ${A2A_PUBLIC_BASE_URL}
            default-input-modes: text,application/json
            default-output-modes: text,application/json
            capabilities:
              streaming: true
              push-notifications: false
              state-transition-history: true
        nacos:
          server-addr: ${NACOS_SERVER:10.117.102.54:8848}
          namespace: ${NACOS_NAMESPACE:}
          username: ${NACOS_USERNAME:}
          password: ${NACOS_PASSWORD:}
          registry:
            enabled: true
          discovery:
            enabled: true
  cloud:
    nacos:
      discovery:
        metadata:
          agent-id: listing-agent
          agent-domains: listing
          agent-runtime-provider: official
          agent-card-path: /.well-known/agent.json
          a2a-path: /a2a

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"
      database: "${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

a2a:
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  memory:
    compression-enabled: ${LISTING_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:listing-master-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

agent:
  skills:
    external-dir: ${AGENT_SKILLS_EXTERNAL_DIR:}
    watch-enabled: ${AGENT_SKILLS_WATCH_ENABLED:true}
listing:
  authorization:
    enabled: ${LISTING_AUTHORIZATION_ENABLED:false}
    audience: listing-master-service
    authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  source:
    provider: ${LISTING_SOURCE_PROVIDER:legacy-local}
    dataset-id: ${LISTING_SOURCE_DATASET_ID:legacy-local}
    fixture-broker-id: ${LISTING_SOURCE_FIXTURE_BROKER_ID:1}
    http:
      base-url: ${LISTING_SOURCE_HTTP_BASE_URL:}
      bearer-token: ${LISTING_SOURCE_HTTP_BEARER_TOKEN:}
      source-system: ${LISTING_SOURCE_HTTP_SYSTEM:upstream}
      confirmed-data-mode: ${LISTING_SOURCE_HTTP_CONFIRMED_DATA_MODE:UNKNOWN}
      connect-timeout-ms: ${LISTING_SOURCE_HTTP_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${LISTING_SOURCE_HTTP_READ_TIMEOUT_MS:3000}
  comparison:
    report:
      storage-dir: ${LISTING_COMPARISON_STORAGE_DIR:/app/runtime/reports}
  rag:
    versioned-authorization-required: false
    space-id: listing.knowledge
    schema-version: "1"
    policy-version: listing-v2
    key-id: listing-current
    secret: ${LISTING_RAG_RPC_SECRET:}
    auth-response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
    auth-response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
    read-role-codes: [ADMIN, BROKER]
    admin-role-codes: [ADMIN]
    dispatcher-enabled: false
    trusted-callers:
      agent-current:
        caller-service: agent-service
        secret: ${AGENT_RAG_RPC_SECRET:}
      customer-read-current:
        caller-service: customer-service
        secret: ${CUSTOMER_LISTING_READ_SECRET:}
      marketing-read-current:
        caller-service: marketing-content-service
        secret: ${MARKETING_LISTING_READ_SECRET:}
      media-listing-current:
        caller-service: media-worker-service
        secret: ${MEDIA_LISTING_AUTH_SECRET:}
  agent:
    model: ${LISTING_AGENT_MODEL:gpt-5.6-terra}
    temperature: ${LISTING_AGENT_TEMPERATURE:0.2}
    max-tokens: ${LISTING_AGENT_MAX_TOKENS:4000}
    system-prompt: |
      You are an authorized property listing search, recommendation, version-bound comparison, and summary agent for a real estate brokerage platform.
      Your responsibilities:
      1. Search and recommend property listings using real data from the platform.
      2. Summarize listing details and explain why recommendations match the request.
      3. Return a structured JSON with: decision (SUCCESS / NO_RESULT / PARTIAL), listingCount, listings (list), searchCriteria (object), and a summary paragraph.
      Always call available tools to get real listing data before making recommendations.
      The top-level JSON must also include contentType="listing", summary (string), and nextHints (string array; use [] when no next agent is needed).
      Return only the JSON object without Markdown fences, internal IDs, reasoning, tool arguments, or extra prose.
