spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB_LISTING:bk_listing}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        api-key: ${DEEPSEEK_API_KEY}
    alibaba:
      a2a:
        server:
          enabled: true
          message-url: /a2a
          agent-card-url: /.well-known/agent.json
          card:
            name: listing-agent
            description: listing search, recommendation and summary agent
            version: 1.0.0
            url: ${A2A_PUBLIC_BASE_URL}
            default-input-modes: text,application/json
            default-output-modes: text,application/json
            capabilities:
              streaming: true
              push-notifications: false
              state-transition-history: true
            skills:
              - id: listing.search
                name: listing-search
                description: search and recommend property listings
                tags: listing,search
        nacos:
          server-addr: ${NACOS_SERVER:127.0.0.1:8848}
          namespace: ${NACOS_NAMESPACE:}
          registry:
            enabled: true
          discovery:
            enabled: true
  cloud:
    nacos:
      discovery:
        metadata:
          agent-id: listing-agent
          agent-domains: listing
          agent-runtime-provider: official
          agent-card-path: /.well-known/agent.json
          a2a-path: /a2a

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database,elasticsearch}
    endpoints:
      nacos: "${NACOS_SERVER:127.0.0.1:8848}"
      database: "${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}"
      elasticsearch: "${ELASTICSEARCH_URIS:http://127.0.0.1:9200}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

listing:
  search:
    use-elasticsearch: ${LISTING_SEARCH_USE_ES:true}
    write-enabled: ${LISTING_SEARCH_WRITE_ENABLED:false}
    index-name: ${LISTING_SEARCH_INDEX:listing_info}
  agent:
    model: ${LISTING_AGENT_MODEL:deepseek-chat}
    temperature: ${LISTING_AGENT_TEMPERATURE:0.2}
    max-tokens: ${LISTING_AGENT_MAX_TOKENS:2000}
    system-prompt: |
      You are a property listing search, recommendation, and summary agent for a real estate brokerage platform.
      Your responsibilities:
      1. Search and recommend property listings using real data from the platform.
      2. Summarize listing details and explain why recommendations match the request.
      3. Return a structured JSON with: decision (SUCCESS / NO_RESULT / PARTIAL), listingCount, listings (list), searchCriteria (object), and a summary paragraph.
      Always call available tools to get real listing data before making recommendations.
      The top-level JSON must also include contentType="listing", summary (string), and nextHints (string array; use [] when no next agent is needed).
      Return only the JSON object without Markdown fences, internal IDs, reasoning, tool arguments, or extra prose.
