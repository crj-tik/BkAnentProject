server:
  max-http-request-header-size: 64KB

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_PLATFORM_OPERATIONS:bk_platform_operations}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${PLATFORM_OPERATIONS_DB_USER}
    password: ${PLATFORM_OPERATIONS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:10.117.102.54}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB_BUSINESS:1}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:1}
          max-wait: ${REDIS_POOL_MAX_WAIT:3000ms}
  ai:
    deepseek:
      # KE OpenAI-compatible gateway (Bella). DeepSeek starter drives chat traffic.
      api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
      base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
      chat:
        api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
        base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
        completions-path: /chat/completions
        options:
          model: gpt-5.6-terra
          temperature: 0.2
    alibaba:
      a2a:
        server:
          enabled: true
          message-url: /a2a
          agent-card-url: /.well-known/agent.json
          card:
            name: platform-operations-agent
            description: 平台经营分析、门店复盘与知识运营
            version: 1.0.0
            url: ${A2A_PUBLIC_BASE_URL}
            default-input-modes: text,application/json
            default-output-modes: text,application/json
            capabilities:
              streaming: true
              push-notifications: false
              state-transition-history: true
        nacos:
          server-addr: ${NACOS_SERVER:10.117.102.54:8848}
          namespace: ${NACOS_NAMESPACE:}
          username: ${NACOS_USERNAME:}
          password: ${NACOS_PASSWORD:}
          registry:
            enabled: true
          discovery:
            enabled: true
    mcp:
      server:
        enabled: ${PLATFORM_OPERATIONS_MCP_ENABLED:false}
        protocol: ${MCP_SERVER_PROTOCOL:STREAMABLE}
        name: platform-operations-mcp-server
        version: ${MCP_SERVER_VERSION:1.0.0}
        streamable-http:
          mcp-endpoint: ${MCP_SERVER_MCP_ENDPOINT:/mcp}
  cloud:
    nacos:
      discovery:
        metadata:
          agent-id: platform-operations-agent
          agent-domains: platform-operations
          agent-runtime-provider: official
          agent-card-path: /.well-known/agent.json
          a2a-path: /a2a

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database,redis}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"
      database: "${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}"
      redis: "${REDIS_HOST:10.117.102.54}:${REDIS_PORT:6379}"
      memory: "${MEMORY_SERVICE_BASE_URL:http://memory-service:9011}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

a2a:
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  execution:
    stream-timeout-ms: 300000
  memory:
    compression-enabled: ${PLATFORM_OPERATIONS_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:platform-operations-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

agent:
  a2a:
    authorization:
      enabled: ${PLATFORM_OPERATIONS_A2A_AUTHORIZATION_ENABLED:true}
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
      trusted-caller-public-keys:
        agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}

knowledge:
  datasource:
    primary:
      url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_PLATFORM_OPERATIONS:bk_platform_operations}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      username: ${PLATFORM_OPERATIONS_DB_USER}
      password: ${PLATFORM_OPERATIONS_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    source:
      url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_PLATFORM_OPERATIONS:bk_platform_operations}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      username: ${PLATFORM_OPERATIONS_SOURCE_DB_USER}
      password: ${PLATFORM_OPERATIONS_SOURCE_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
  source:
    view-name: knowledge_interview_public_source_v1
    view-version: 1
    supported-sanitization-revision: 1
    max-content-characters: 2000000
  authorization:
    enabled: ${PLATFORM_OPERATIONS_AUTHORIZATION_ENABLED:true}
    audience: platform-operations-service
    max-body-bytes: 1048576
    authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}

platform-operations:
  analytics:
    authorization:
      enabled: ${PLATFORM_OPERATIONS_AUTHORIZATION_ENABLED:true}
      audience: platform-operations-service
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
    ranking:
      use-redis: true
      key-prefix: "platform-operations:ranking:"
    redis:
      enabled: true
      ranking-key-prefix: "platform-operations:ranking:"
      ranking-ttl-hours: 24
    agent:
      model: gpt-5.6-terra
      temperature: 0.2
      max-tokens: 4000
      system-prompt: |
        你是平台经营分析助手。使用可用的经营工具获取指定月份或日期的实际记录，再总结 KPI、员工日工作量、门店仪表盘、房源流转效率和排行榜。
        仅陈述工具返回的字段与统计口径，不虚构同比、环比、目标、原因或未提供的指标。数据为空时明确说明当前没有记录。
        storeName、scope 等筛选值必须来自已验证的授权上下文或用户明确授权的查询范围，不得把用户输入当成身份授权。
        返回简洁、可核验的结构化结论，并区分数据事实与建议。
  review:
    authorization:
      enabled: ${PLATFORM_OPERATIONS_AUTHORIZATION_ENABLED:true}
      audience: platform-operations-service
      max-body-bytes: 1048576
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
    sources:
      mode: ${PLATFORM_OPERATIONS_SOURCE_MODE:http}
      listing-base-url: ${PLATFORM_OPERATIONS_LISTING_BASE_URL:http://listing-master-service:9004}
      connect-timeout-ms: 2000
      read-timeout-ms: 5000
    agent:
      system-prompt: |
        你是门店经营复盘助手。只依据 Memory 已授权上下文和明确提供的来源事实形成待审核草稿。
        将事实、假设、资料缺口和建议动作分开表达；缺少客户反馈或价格依据时明确说明，不得补造。
        不得确认计划、回写动作、改变房源/客户/成交状态或宣称业绩因果增长。所有动作由用户通过业务 API 明确触发。

mcp:
  authorization:
    server:
      # Keep disabled until both key sets and the exact per-tool allowlist are configured.
      enabled: false
      caller-service: agent-service
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
      caller-public-keys:
        agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
      # tool name -> registered permission code; no implicit public tools.
      tool-operations: {}
      public-tools: []
