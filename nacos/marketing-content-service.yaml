spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}/${MYSQL_DB_MARKETING:bk_marketing}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  elasticsearch:
    uris: ${MARKETING_ELASTICSEARCH_URIS:http://10.117.102.54:9200}
  ai:
    deepseek:
      # KE OpenAI-compatible gateway (Bella). DeepSeek starter drives chat traffic.
      api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
      base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
      chat:
        api-key: ${DEEPSEEK_API_KEY:${KE_API_KEY:}}
        base-url: ${DEEPSEEK_BASE_URL:https://open-chatgpt.ke.com/v1}
        completions-path: /chat/completions
        options:
          model: ${MARKETING_AGENT_MODEL:gpt-5.6-terra}
          temperature: 0.2
    alibaba:
      a2a:
        server:
          enabled: true
          message-url: /a2a
          agent-card-url: /.well-known/agent.json
          card:
            name: marketing-agent
            description: marketing copy generation and publish execution agent
            version: 1.0.0
            url: ${A2A_PUBLIC_BASE_URL}
            default-input-modes: text,application/json
            default-output-modes: text,application/json
            capabilities:
              streaming: true
              push-notifications: false
              state-transition-history: true
        nacos:
          server-addr: ${NACOS_SERVER:10.117.102.54:8848}
          namespace: ${NACOS_NAMESPACE:}
          username: ${NACOS_USERNAME:}
          password: ${NACOS_PASSWORD:}
          registry:
            enabled: true
          discovery:
            enabled: true
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        protocol: ${MCP_SERVER_PROTOCOL:STREAMABLE}
        name: marketing-mcp-server
        version: ${MCP_SERVER_VERSION:1.0.0}
        streamable-http:
          mcp-endpoint: ${MCP_SERVER_MCP_ENDPOINT:/mcp}
  cloud:
    nacos:
      discovery:
        metadata:
          agent-id: marketing-agent
          agent-domains: marketing
          agent-runtime-provider: official
          agent-card-path: /.well-known/agent.json
          a2a-path: /a2a

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencyReadiness

service:
  readiness:
    mode: ${SERVICE_READINESS_MODE:distributed}
    required-dependencies: ${SERVICE_READINESS_REQUIRED_DEPENDENCIES:nacos,database,elasticsearch}
    endpoints:
      nacos: "${NACOS_SERVER:10.117.102.54:8848}"
      database: "${MYSQL_HOST:10.117.102.54}:${MYSQL_PORT:3306}"
      elasticsearch: "${MARKETING_ELASTICSEARCH_URIS:http://10.117.102.54:9200}"

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

a2a:
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  memory:
    compression-enabled: ${MARKETING_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:marketing-content-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

marketing:
  authorization:
    enabled: false
  campaign:
    mode: REAL
    dispatch-enabled: true
    rule-version: campaign-rules-v1
    plan-ttl-seconds: 900
    listing-snapshot-base-url: ${LISTING_SNAPSHOT_BASE_URL:http://listing-master-service:9004}
  listing-read:
    key-id: marketing-read-current
    signing-secret: ${MARKETING_LISTING_READ_SECRET:}
  search:
    use-elasticsearch: true
    write-enabled: ${MARKETING_SEARCH_WRITE_ENABLED:false}
    index-name: ${MARKETING_SEARCH_INDEX:marketing_content}
    sync-mode: ${MARKETING_SEARCH_SYNC_MODE:CANAL}
  agent:
    model: ${MARKETING_AGENT_MODEL:gpt-5.6-terra}
    temperature: ${MARKETING_AGENT_TEMPERATURE:0.2}
    max-tokens: ${MARKETING_AGENT_MAX_TOKENS:4000}
    llm-generation-enabled: ${MARKETING_LLM_GENERATION_ENABLED:true}
    system-prompt: |
      You are a marketing content generation agent for a real estate brokerage platform.
      Your responsibilities:
      1. Generate factual marketing copy for property listings tailored to DOUYIN, WECHAT, or XIAOHONGSHU.
      2. Use available tools only to search content, create DRAFT content, or prepare an approved campaign plan.
      3. This agent cannot confirm campaigns, publish content, or send notifications. Never claim PUBLISHED from model output, tool acceptance, or plan preparation; the domain receipt is the only publication evidence.
      4. Return a structured JSON with intent (generate_copy / publish_prepare), decision (SUCCESS / FAILED / QUEUED), contentId, platform, publishStatus="DRAFT", draftText, and a concise summary.
      Always use available tools to create real content rather than inventing results.
      When writing copy, be factual, professional, and highlight the property's unique selling points.
      The top-level JSON must also include contentType="marketing", summary (string), and nextHints (string array; use [] when no next agent is needed).
      Return only the JSON object without Markdown fences, internal IDs, reasoning, tool arguments, or extra prose.

mcp:
  authorization:
    server:
      # Keep disabled until both key sets and the exact per-tool allowlist are configured.
      enabled: false
      caller-service: agent-service
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
      caller-public-keys:
        agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
      # tool name -> registered permission code; no implicit public tools.
      tool-operations: {}
      public-tools: []
