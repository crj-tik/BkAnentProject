memory:
  rag:
    key-id: ${MEMORY_RAG_RPC_KEY_ID:memory-current}
    signing-secret: ${MEMORY_RAG_RPC_SECRET:}
    auth-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:}
    auth-signing-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
    policy-version: ${MEMORY_RAG_POLICY_VERSION:memory-v1}
    dispatcher-enabled: ${MEMORY_RAG_DISPATCHER_ENABLED:false}
    # Explicit deployment-managed registration, never seed every active role.
    constraint-read-roles: ${MEMORY_RAG_CONSTRAINT_READ_ROLES:}
    constraint-admin-roles: ${MEMORY_RAG_CONSTRAINT_ADMIN_ROLES:}
    # LR-43: empty by default; deployment must explicitly register verified scoringVersion(s).
    semantic-scoring-versions: ${MEMORY_RAG_SEMANTIC_SCORING_VERSIONS:}
    trusted-callers: {}
  system-constraint-bootstrap:
    enabled: ${MEMORY_CONSTRAINT_BOOTSTRAP_ENABLED:true}

dubbo:
  application:
    name: memory-service
    qos-enable: false
    # hessian2 wire pin (KI-113 follow-up): fastjson2 2.0.52+ JSONB crashes decoding Dubbo's
    # FieldBased record payloads with list fields (see RagFastjson2JsonbRoundTripTest). Ordering
    # hessian2 first in the consumer prefer list makes the wire negotiation select hessian2 for
    # every outbound RAG call; provider RAG services also pin serialization=hessian2.
    prefer-serialization: fastjson2ctor,fastjson2
  protocol:
    name: dubbo
    port: ${MEMORY_DUBBO_PORT:20891}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
  consumer:
    protocol: dubbo
    check: false
    init: false
    retries: 0
  # Per-interface reference attributes (Dubbo 3.2 keyed-config form) land directly on the invoker
  # URL; together with the provider-side pin this keeps the whole RAG wire on fastjson2ctor.
  # KI-113 follow-up.
  reference:
    com.bkanent.common.rpc.RagPrincipalRpcService:
      serialization: fastjson2ctor
    com.bkanent.common.rpc.RagRetrievalRpcService:
      serialization: fastjson2ctor
    com.bkanent.common.rpc.RagIndexRpcService:
      serialization: fastjson2ctor

server:
  port: 9011

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: memory-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml
