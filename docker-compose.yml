      RAG_RERANK_EXPECTED_ARTIFACT_DIGEST: ${RAG_RERANK_EXPECTED_ARTIFACT_DIGEST:-76cd4a977b9001bf8e28e41bac6ce53b2d334d0c567f6928a9b88655bafc833f}
      RAG_AUTH_RPC_SECRET: ${RAG_AUTH_RPC_SECRET:-}
      AGENT_RAG_RPC_SECRET: ${AGENT_RAG_RPC_SECRET:-}
      LISTING_RAG_RPC_SECRET: ${LISTING_RAG_RPC_SECRET:-}
      MEMORY_RAG_RPC_SECRET: ${MEMORY_RAG_RPC_SECRET:-}
