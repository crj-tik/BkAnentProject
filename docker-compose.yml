name: bk-anent-dev

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: distributed
  NACOS_SERVER: nacos:8848
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-BK-AGENT}
  SPRING_CLOUD_NACOS_USERNAME: ${NACOS_CLIENT_USERNAME:-}
  SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_CLIENT_PASSWORD:-}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Explicit MYSQL_ROOT_PASSWORD required}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
  ROCKETMQ_NAMESRV_HOST: rocketmq-namesrv
  ROCKETMQ_NAMESRV_PORT: "9876"
  MINIO_HOST: minio
  MINIO_PORT: "9000"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Explicit MINIO_ROOT_PASSWORD required}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://127.0.0.1:19000}
  AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Explicit AUTH_TOKEN_SECRET required}
  SERVICE_IDENTITY_PRIVATE_KEY_FILE: /run/secrets/service-identity.pem
  AUTH_SERVICE_IDENTITY_KEY_ID: ${AUTH_SERVICE_IDENTITY_KEY_ID:-auth-service-current}
  # Spring AI validates provider keys during bean creation. The placeholders
  # only keep local containers bootable; real AI calls still require keys.
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${KE_API_KEY:-local-dev-placeholder}}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://open-chatgpt.ke.com/v1}
  KE_API_KEY: ${KE_API_KEY:-}
  KE_OCR_BASE_URL: ${KE_OCR_BASE_URL:-https://open-chatgpt.ke.com/v1}
  KE_OCR_MODEL: ${KE_OCR_MODEL:-baidu-general}
  KE_IMAGE_BASE_URL: ${KE_IMAGE_BASE_URL:-https://open-chatgpt.ke.com/v1}
  KE_IMAGE_MODEL: ${KE_IMAGE_MODEL:-doubao-seedream-4.5-gen}
  A2A_PUBLIC_BASE_URL: ${A2A_PUBLIC_BASE_URL:-http://localhost}
  SERVICE_READINESS_MODE: distributed
  # Business modes, token TTLs, stream and search switches are owned by Nacos.

x-app-service: &app-service
  image: bk-anent-services:dev
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - ./.secrets/service-identities/public-keys.env
  depends_on:
    config-init:
      condition: service_completed_successfully
    mysql:
      condition: service_healthy
  networks: [bk]

x-minimal-app-service: &minimal-app-service
  <<: *app-service
  image: bk-anent-services:minimal
  build:
    context: .
    dockerfile: Dockerfile
    args:
      MAVEN_MODULES: common,gateway,auth-service

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Explicit MYSQL_ROOT_PASSWORD required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # Fresh and existing volumes share the reviewed versioned manifest, not a SQL glob.
      - ./docker/mysql/001-manifest.sh:/docker-entrypoint-initdb.d/001-manifest.sh:ro
      - ./docker/mysql:/opt/bk-init/docker/mysql:ro
      - ./sql:/opt/bk-init/sql:ro
      - ./scripts/deploy/run-init-manifest.sh:/opt/bk-init/scripts/deploy/run-init-manifest.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bk]

  # This short-lived job also provisions the account on existing data volumes.
  mysql-mcp-init:
    image: bk-anent-mysql-mcp:dev
    build:
      context: ./mysql-mcp
    profiles: [mcp]
    restart: "no"
    command: ["python", "init_account.py"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Explicit MYSQL_ROOT_PASSWORD required}
      MYSQL_MCP_PASSWORD: ${MYSQL_MCP_PASSWORD:-}
      MYSQL_MCP_DATABASES: ${MYSQL_MCP_DATABASES:-bk_auth,bk_listing,bk_customer,bk_notification,bk_marketing,bk_promotion,bk_business,bk_agent,bk_memory,bk_contract,bk_settlement,bk_interview,bk_knowledge}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [bk]

  mysql-mcp:
    image: bk-anent-mysql-mcp:dev
    build:
      context: ./mysql-mcp
    profiles: [mcp]
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: mcp_ro
      MYSQL_PASSWORD: ${MYSQL_MCP_PASSWORD:-}
      MYSQL_MCP_DATABASES: ${MYSQL_MCP_DATABASES:-bk_auth,bk_listing,bk_customer,bk_notification,bk_marketing,bk_promotion,bk_business,bk_agent,bk_memory,bk_contract,bk_settlement,bk_interview,bk_knowledge}
      MYSQL_MCP_TOKEN: ${MYSQL_MCP_TOKEN:-}
      MYSQL_MCP_MAX_ROWS: ${MYSQL_MCP_MAX_ROWS:-200}
      MYSQL_MCP_QUERY_TIMEOUT_MS: ${MYSQL_MCP_QUERY_TIMEOUT_MS:-5000}
      MYSQL_MCP_ALLOWED_HOSTS: ${MYSQL_MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,mysql-mcp:8000}
    ports:
      - "${MYSQL_MCP_BIND_ADDRESS:-127.0.0.1}:${MYSQL_MCP_EXPOSED_PORT:-18081}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-mcp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [bk]

  nacos:
    image: nacos/nacos-server:v3.1.0
    restart: unless-stopped
    environment:
      MODE: standalone
      # Server-to-server auth stays off in dev (identity header short-circuit); the
      # console/admin user store still applies (bkagent/BK-AGENT namespace, see .env).
      # Production: set NACOS_AUTH_ENABLE=true and rotate NACOS_AUTH_TOKEN.
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NACOS_EXPOSED_PORT:-8848}:8848"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NACOS_CONSOLE_EXPOSED_PORT:-18080}:8080"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NACOS_GRPC_EXPOSED_PORT:-9848}:9848"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NACOS_GRPC_TLS_EXPOSED_PORT:-9849}:9849"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/v3/console/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [bk]

  config-init:
    image: python:3.12-alpine
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-BK-AGENT}
      NACOS_CONFIG_GROUP: DEFAULT_GROUP
      NACOS_CONFIG_DATA_IDS: ${NACOS_CONFIG_DATA_IDS:-}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_USERNAME: ${NACOS_USERNAME:-bkagent}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    entrypoint: ["python", "/scripts/publish-nacos.py"]
    volumes:
      - ./nacos:/config:ro
      - ./scripts/deploy/publish-nacos.py:/scripts/publish-nacos.py:ro
    read_only: true
    tmpfs: [/tmp]
    networks: [bk]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    profiles: [minimal, full]
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --aclfile
      - /etc/redis/users.acl
      - --port
      - "6379"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /run/secrets/redis/server.crt
      - --tls-key-file
      - /run/secrets/redis/server.key
      - --tls-ca-cert-file
      - /run/secrets/redis/ca.crt
      - --tls-auth-clients
      - "no"
    volumes:
      - redis-data:/data
      - type: bind
        source: ./.secrets/redis/acl
        target: /etc/redis
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/redis/tls/server.crt
        target: /run/secrets/redis/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/redis/tls/server.key
        target: /run/secrets/redis/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/redis/tls/ca.crt
        target: /run/secrets/redis/ca.crt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_EXPOSED_PORT:-6379}:6379"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_TLS_EXPOSED_PORT:-6380}:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bk]

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    profiles: [full]
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${ROCKETMQ_NAMESRV_EXPOSED_PORT:-9876}:9876"
    networks: [bk]

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    profiles: [full]
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/rocketmq-5.3.1/conf/broker.conf"]
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${ROCKETMQ_BROKER_EXPOSED_PORT:-10911}:10911"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${ROCKETMQ_BROKER_VIP_EXPOSED_PORT:-10909}:10909"
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
    networks: [bk]

  minio:
    image: minio/minio:latest
    profiles: [full]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Explicit MINIO_ROOT_PASSWORD required}
    volumes:
      - minio-data:/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_EXPOSED_PORT:-19000}:9000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_EXPOSED_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bk]

  minio-init:
    image: minio/mc:latest
    profiles: [full]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        echo "MinIO bucket $${MINIO_BUCKET} is ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Explicit MINIO_ROOT_PASSWORD required}
      MINIO_BUCKET: ${MINIO_BUCKET:-generated-assets}
    networks: [bk]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: [full]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_EXPOSED_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [bk]

  elasticsearch-init:
    image: curlimages/curl:8.10.1
    profiles: [full]
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Listing RAG indices are created only by an authorized RAG provision operation.
        for index_name in marketing_content; do
          http_code=$$(curl --silent --show-error -o /dev/null -w "%{http_code}" \
            -X PUT "http://elasticsearch:9200/$${index_name}" \
            -H "Content-Type: application/json" \
            -d '{"settings":{"number_of_shards":1,"number_of_replicas":0}}')
          case "$${http_code}" in
            200|201|400) echo "Elasticsearch index $${index_name} is ready" ;;
            *) echo "Failed to initialize Elasticsearch index $${index_name}: HTTP $${http_code}"; exit 1 ;;
          esac
        done
    networks: [bk]
    restart: "no"

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    profiles: [full]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MILVUS_ETCD_EXPOSED_PORT:-2379}:2379"
    healthcheck:
      test: ["CMD-SHELL", "ETCDCTL_API=3 etcdctl endpoint health --endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bk]

  milvus-minio:
    image: minio/minio:latest
    profiles: [full]
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_ROOT_PASSWORD:?Explicit MILVUS_MINIO_ROOT_PASSWORD required}
    volumes:
      - milvus-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bk]

  milvus:
    image: milvusdb/milvus:v2.4.17
    profiles: [full]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MILVUS_EXPOSED_PORT:-19530}:19530"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MILVUS_HEALTH_EXPOSED_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9091/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [bk]

  auth-service:
    <<: *minimal-app-service
    profiles: [minimal, full]
    depends_on:
      config-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.secrets/service-identities/auth-service/private-key.pem
        target: /run/secrets/service-identity.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/redis/tls/truststore.jks
        target: /run/secrets/redis-truststore.jks
        read_only: true
        bind:
          create_host_path: false
    environment:
      <<: *app-environment
      SERVICE_ARTIFACT: auth-service-1.0.0-SNAPSHOT.jar
      AUTH_AUTHORIZATION_ENABLED: ${AUTH_AUTHORIZATION_ENABLED:-false}
      AUTH_AUTHORIZATION_REDIS_ENABLED: ${AUTH_AUTHORIZATION_REDIS_ENABLED:-false}
      AUTHZ_REDIS_WRITER_CONFIGURED: ${AUTHZ_REDIS_WRITER_CONFIGURED:-false}
      AUTHZ_REDIS_HOST: ${AUTHZ_REDIS_HOST:-redis}
      AUTHZ_REDIS_PORT: ${AUTHZ_REDIS_PORT:-6380}
      AUTHZ_REDIS_WRITER_PASSWORD: ${AUTHZ_REDIS_WRITER_PASSWORD:-}
      AUTHZ_REDIS_TLS: ${AUTHZ_REDIS_TLS:-true}
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/secrets/redis-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS
      RAG_AUTH_RPC_SECRET: ${RAG_AUTH_RPC_SECRET:-}
      LISTING_RAG_RPC_SECRET: ${LISTING_RAG_RPC_SECRET:-}
      MEMORY_RAG_RPC_SECRET: ${MEMORY_RAG_RPC_SECRET:-}
      AGENT_RAG_RPC_SECRET: ${AGENT_RAG_RPC_SECRET:-}
      AUTH_RAG_RPC_RESPONSE_KEY_ID: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:-auth-current}
      AUTH_RAG_RPC_RESPONSE_SECRET: ${AUTH_RAG_RPC_RESPONSE_SECRET:-}
      A2A_PUBLIC_BASE_URL: http://auth-service:9101
      SERVICE_READINESS_REQUIRED_DEPENDENCIES: nacos,database,redis
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AUTH_EXPOSED_PORT:-9101}:9101"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9101/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    <<: *minimal-app-service
    profiles: [minimal, full]
    depends_on:
      config-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.secrets/service-identities/gateway/private-key.pem
        target: /run/secrets/service-identity.pem
        read_only: true
        bind:
          create_host_path: false
    environment:
      <<: *app-environment
      SERVICE_ARTIFACT: gateway-1.0.0-SNAPSHOT.jar
      GATEWAY_AUTHORIZATION_ENABLED: ${GATEWAY_AUTHORIZATION_ENABLED:-false}
      GATEWAY_AUTHORIZATION_KEY_ID: ${GATEWAY_AUTHORIZATION_KEY_ID:-gateway-current}
      A2A_PUBLIC_BASE_URL: http://gateway:5010
      AUTH_ROUTE_URI: http://auth-service:9101
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_EXPOSED_PORT:-5010}:5010"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:5010/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  agent-service:
    <<: *app-service
    profiles: [full]
    depends_on:
      config-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      memory-service:
        condition: service_started
    volumes:
      - type: bind
        source: ./.secrets/service-identities/agent-service/private-key.pem
        target: /run/secrets/service-identity.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/redis/tls/truststore.jks
        target: /run/secrets/redis-truststore.jks
        read_only: true
        bind:
          create_host_path: false
    environment:
      <<: *app-environment
      SERVICE_ARTIFACT: agent-service-1.0.0-SNAPSHOT.jar
      AGENT_AUTHORIZATION_ENABLED: ${AGENT_AUTHORIZATION_ENABLED:-false}
      AUTHZ_REDIS_READER_CONFIGURED: ${AUTHZ_REDIS_READER_CONFIGURED:-false}
      AUTHZ_REDIS_HOST: ${AUTHZ_REDIS_HOST:-redis}
      AUTHZ_REDIS_PORT: ${AUTHZ_REDIS_PORT:-6380}
      AUTHZ_REDIS_READER_PASSWORD: ${AUTHZ_REDIS_READER_PASSWORD:-}
      AUTHZ_REDIS_TLS: ${AUTHZ_REDIS_TLS:-true}
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/secrets/redis-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS
      A2A_PUBLIC_BASE_URL: http://agent-service:9002
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SERVICE_READINESS_REQUIRED_DEPENDENCIES: nacos,database,redis,rocketmq,memory
      AGENT_MEMORY_V2_COMPRESSION_ENABLED: ${AGENT_MEMORY_V2_COMPRESSION_ENABLED:-false}
      SERVICE_IDENTITY_KEY_ID: agent-service-current
      AGENT_MEMORY_V2_CACHE_ENTRIES: ${AGENT_MEMORY_V2_CACHE_ENTRIES:-128}
      AGENT_MEMORY_V2_CACHE_BYTES: ${AGENT_MEMORY_V2_CACHE_BYTES:-33554432}
      AGENT_MEMORY_V2_CACHE_TTL_MS: ${AGENT_MEMORY_V2_CACHE_TTL_MS:-60000}
