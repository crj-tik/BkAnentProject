server:
  port: 9101

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  profiles:
    default: distributed
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

# RAG-only RPC credentials. Empty secrets fail closed, including in the local profile.
# Additional trusted-keys entries can be supplied by secret-managed config for rotation.
auth:
  rag:
    rpc:
      trusted-keys:
        rag-current:
          caller-service: rag-service
          secret: ${RAG_AUTH_RPC_SECRET:}
        listing-current:
          caller-service: listing-master-service
          secret: ${LISTING_RAG_RPC_SECRET:}
        memory-current:
          caller-service: memory-service
          secret: ${MEMORY_RAG_RPC_SECRET:}
      response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:}
      response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}

dubbo:
  application:
    name: auth-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22511                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20881
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}
