<text x="112" y="1080" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400">• 中间决策向不同分支跳转：继续、重新规划、终止/失败；不是顺序执行三个分支。</text>
<text x="112" y="1107" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400">• 图展示已有控制结构，不代表所有写操作都自动触发审批；是否审批取决于规划和路由结果。</text>
