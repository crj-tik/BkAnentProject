<text x="112" y="1046" fill="#142b45" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">阅读说明 / 实现边界</text>
<text x="112" y="1080" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400">• 房源比较是 Listing 域能力，不是独立 A2A Agent、MCP server 或 Dubbo provider。</text>
<text x="112" y="1107" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400">• 旧 Long ID 兼容入口只映射为 legacy-local；匿名分享不恢复。</text>
