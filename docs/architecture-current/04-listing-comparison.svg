<text x="1262" y="274" fill="#142b45" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">03  授权与来源解析</text>
<text x="1262" y="317" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">校验 compare.report.create</text>
<text x="1262" y="343" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">解析每个引用的可信来源</text>
<rect x="1240" y="500" width="470" height="180" rx="16" fill="#e5f5ef" stroke="#168568" stroke-width="2"/>
<text x="1262" y="544" fill="#142b45" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">04  批量读取快照</text>
<text x="1262" y="587" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">按 sourceId 批量读取当前房源</text>
<text x="1262" y="613" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">保留 source revision 与 dataMode</text>
