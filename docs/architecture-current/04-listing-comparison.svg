<text x="687" y="587" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">比较 revision、contentHash、单位</text>
<text x="687" y="613" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">拒绝过期或来源不完整的输入</text>
