<text x="112" y="317" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">稳定 listingRef、预期 revision</text>
<text x="112" y="343" fill="#52677d" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400">及签名 actor / 操作上下文</text>
