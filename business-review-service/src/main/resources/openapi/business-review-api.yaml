openapi: 3.1.0
info:
  title: 门店经营复盘 API
  version: 1.0.0
  description: >-
    独立于 business-service 的门店复盘 API。调用者、门店归属和操作权限只来自 Gateway
    验证并签署的 Auth 上下文。请求中的 employeeId、记录 ID、datasetId 或模型文本不会授予权限。
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost
tags:
  - name: Reviews
paths:
  /business-review/reviews:
    post:
      tags: [Reviews]
      operationId: createStoreReview
      x-bkanent-authz-operation: business.review.create.store
      summary: 创建门店复盘事项
      description: datasetId 仅选择来源数据集；storeId 必须与签名 Auth 上下文中的 STORE 身份一致。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '200':
          description: 事项和初始诊断已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewMatter'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}
    get:
      tags: [Reviews]
      operationId: listStoreReviews
      x-bkanent-authz-operation: business.review.read.store
      summary: 分页读取门店复盘事项
      security:
        - bearerAuth: []
      parameters:
        - name: storeId
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 64}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 当前来源仍有效的事项；来源失效事项会返回遮蔽后的待复核状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewPage'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}
  /business-review/reviews/{reviewId}:
    get:
      tags: [Reviews]
      operationId: getStoreReview
      x-bkanent-authz-operation: business.review.read.store
      summary: 读取复盘事项
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reviewId'
      responses:
        '200':
          description: 事项详情；来源版本变化或撤回时证据和诊断正文会被遮蔽
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewMatter'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}
  /business-review/reviews/{reviewId}/plans:
    get:
      tags: [Reviews]
      operationId: listReviewPlans
      x-bkanent-authz-operation: business.review.read.store
      summary: 读取复盘计划版本
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reviewId'
      responses:
        '200':
          description: 当前门店的计划版本；失效计划正文会被遮蔽
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/ReviewPlan'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}
    post:
      tags: [Reviews]
      operationId: writeReviewPlan
      x-bkanent-authz-operation: business.review.plan.write.store
      summary: 保存一个不可变计划版本
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritePlanRequest'
      responses:
        '200':
          description: 计划版本已保存，尚未确认执行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ReviewPlan'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}
  /business-review/reviews/{reviewId}/plans/confirm:
    post:
      tags: [Reviews]
      operationId: confirmReviewPlan
      x-bkanent-authz-operation: business.review.plan.confirm.store
      summary: 明确确认当前计划版本
      description: 同一 requestId 和 parameterHash 的重试返回原始回执；不同 hash 冲突。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPlanRequest'
      responses:
        '200':
          description: 确认回执及创建的动作
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ConfirmationReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}
  /business-review/reviews/{reviewId}/actions:
    get:
      tags: [Reviews]
      operationId: listReviewActions
      x-bkanent-authz-operation: business.review.read.store
      summary: 读取复盘动作和执行记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reviewId'
      responses:
        '200':
          description: 门店范围内的动作和人工执行回执
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/ReviewAction'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /business-review/reviews/{reviewId}/actions/{actionId}/feedback:
    post:
      tags: [Reviews]
      operationId: recordReviewActionFeedback
      x-bkanent-authz-operation: business.review.action.feedback.store
      summary: 记录动作的人工反馈
      description: 按 requestId 和 expectedActionVersion 幂等记录 USER_REPORTED；不会修改房源、客户或成交真源。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reviewId'
        - name: actionId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionFeedbackRequest'
      responses:
        '200':
          description: 动作状态和独立保存的反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ReviewAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /business-review/reviews/{reviewId}/observations:
    get:
      tags: [Reviews]
      operationId: readReviewObservation
      x-bkanent-authz-operation: business.review.observation.read.store
      summary: 读取效率和经营阶段观察值
      description: 观察值包含来源模式、窗口和口径，不将前后变化解释为动作导致的增长。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reviewId'
      responses:
        '200':
          description: 观察指标
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ReviewObservation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gateway 验证令牌并签署短期 Auth 上下文；调用者不能自行提交可信 STORE 或 actor。
  parameters:
    reviewId:
      name: reviewId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: 参数或来源契约无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: 身份验证失败
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: 操作权限、签名门店范围或来源授权不匹配
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: 事项、计划或动作不存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: 版本、幂等键或状态转换冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    SourceUnavailable:
      description: 已选择的 HTTP 来源不可用；不会回退到 fixture
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiResponse:
      type: object
      properties:
        success: {type: boolean}
        code: {type: [string, 'null']}
        message: {type: [string, 'null']}
        data: {}
      required: [success]
    ApiError:
      type: object
      properties:
        success: {type: boolean, const: false}
        code: {type: string}
        message: {type: string}
      required: [success, code]
    CreateReviewRequest:
      type: object
      properties:
        storeId: {type: integer, format: int64, minimum: 1}
        datasetId: {type: string, minLength: 1, maxLength: 128}
      required: [storeId, datasetId]
      description: employeeId 等未知字段不会用于确定 actor 或 store owner。
    WritePlanRequest:
      type: object
      properties:
        expectedMatterVersion: {type: integer, minimum: 1}
        expectedDiagnosisRevision: {type: integer, minimum: 1}
        dueAt: {type: string, format: date-time}
        actions:
          type: array
          minItems: 1
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 500}
      required: [expectedMatterVersion, expectedDiagnosisRevision, dueAt, actions]
    ConfirmPlanRequest:
      type: object
      properties:
        expectedPlanVersion: {type: integer, minimum: 1}
        requestId: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
        parameterHash: {type: string, pattern: '^[a-f0-9]{64}$'}
      required: [expectedPlanVersion, requestId, parameterHash]
    ActionFeedbackRequest:
      type: object
      properties:
        requestId: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
        expectedActionVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [IN_PROGRESS, DONE, CANCELLED]}
        evidenceLevel: {type: string, const: USER_REPORTED}
        note: {type: [string, 'null'], maxLength: 2000}
      required: [requestId, expectedActionVersion, status, evidenceLevel]
    SourceReference:
      type: object
      properties:
        sourceSystem: {type: string}
        sourceId: {type: string}
        revision: {type: string}
        observedAt: {type: string, format: date-time}
        eventTime: {type: [string, 'null'], format: date-time}
        dataMode: {type: string, enum: [SIMULATED, REAL, MIXED, UNKNOWN]}
        datasetId: {type: string}
        sourceStatus: {type: string}
        contentHash: {type: [string, 'null']}
    ReviewFact:
      type: object
      properties:
        kind: {type: string, enum: [SHOWING, FOLLOW_UP, NEGOTIATION, LISTING_MAINTENANCE, KNOWLEDGE]}
        source: {$ref: '#/components/schemas/SourceReference'}
        summary: {type: string}
        feedback: {type: [string, 'null']}
        nextStepRecorded: {type: boolean}
        attributes: {type: object, additionalProperties: {type: string}}
    ReviewMatter:
      type: object
      properties:
        reviewId: {type: string, format: uuid}
        storeId: {type: integer, format: int64}
        actorId: {type: integer, format: int64}
        datasetId: {type: string}
        dataMode: {type: string, enum: [SIMULATED, REAL, MIXED, UNKNOWN]}
        status: {type: string, enum: [OPEN, PLAN_PENDING_REVIEW, PLANNED, IN_PROGRESS, CLOSED]}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        diagnosis:
          type: object
          properties:
            confirmedFacts: {type: array, items: {type: string}}
            hypotheses: {type: array, items: {type: string}}
            evidenceGaps: {type: array, items: {type: string}}
            suggestedActions: {type: array, items: {type: string}}
        evidence: {type: array, items: {$ref: '#/components/schemas/ReviewFact'}}
    ReviewPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReviewMatter'}}
        nextCursor: {type: [string, 'null']}
      required: [items]
    ReviewPlan:
      type: object
      properties:
        reviewId: {type: string, format: uuid}
        version: {type: integer}
        diagnosisRevision: {type: integer}
        ownerActorId: {type: integer, format: int64}
        dueAt: {type: string, format: date-time}
        actions: {type: array, items: {type: string}}
        sourceRevisions: {type: array, items: {type: string}}
        parameterHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {type: string}
        createdAt: {type: string, format: date-time}
    ReviewAction:
      type: object
      properties:
        actionId: {type: string, format: uuid}
        reviewId: {type: string, format: uuid}
        planVersion: {type: integer}
        version: {type: integer}
        description: {type: string}
        status: {type: string, enum: [PROPOSED, CONFIRMED, IN_PROGRESS, DONE, CANCELLED]}
        evidenceLevel: {type: [string, 'null'], enum: [USER_REPORTED, SOURCE_CONFIRMED, null]}
        actorId: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
        sourceReceiptId: {type: [string, 'null']}
        feedbackNote: {type: [string, 'null'], maxLength: 2000}
    ConfirmationReceipt:
      type: object
      properties:
        requestId: {type: string}
        reviewId: {type: string, format: uuid}
        planVersion: {type: integer}
        parameterHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        actions: {type: array, items: {$ref: '#/components/schemas/ReviewAction'}}
        confirmedAt: {type: string, format: date-time}
    MetricObservation:
      type: object
      properties:
        metricId: {type: string}
        definitionVersion: {type: string}
        status: {type: string, enum: [KNOWN, UNKNOWN]}
        reason: {type: [string, 'null']}
        observedAt: {type: string, format: date-time}
        timeZone: {type: string}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        aggregationUnit: {type: string}
        numerator: {type: integer}
        denominator: {type: integer}
        value: {type: [number, 'null']}
        lateEventCount: {type: integer}
        crossWindowEventCount: {type: integer}
    ReviewObservation:
      type: object
      properties:
        reviewId: {type: string, format: uuid}
        dataMode: {type: string, enum: [SIMULATED, REAL, MIXED, UNKNOWN]}
        efficiency: {$ref: '#/components/schemas/MetricObservation'}
        businessStage: {$ref: '#/components/schemas/MetricObservation'}
        observedAt: {type: string, format: date-time}
        sourceModes: {type: array, items: {type: string}}
        interpretation: {type: string}
