server:
  port: 9004

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: listing-master-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

dubbo:
  application:
    name: listing-master-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22517                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20884
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}

listing:
  rag:
    key-id: ${LISTING_RAG_RPC_KEY_ID:listing-current}
    secret: ${LISTING_RAG_RPC_SECRET:}
    auth-response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-response-current}
    auth-response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
    policy-version: listing-v1
    schema-version: "1"
    read-role-codes: []
    admin-role-codes: []
    dispatcher-enabled: ${LISTING_RAG_DISPATCHER_ENABLED:false}
    legacy-reconciliation-enabled: ${LISTING_RAG_LEGACY_RECONCILIATION_ENABLED:false}
    trusted-callers:
      agent-current:
        caller-service: agent-service
        secret: ${AGENT_RAG_RPC_SECRET:}
