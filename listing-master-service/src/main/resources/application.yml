server:
  port: 9004

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: listing-master-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

service:
  identity:
    key-id: ${SERVICE_IDENTITY_KEY_ID:listing-master-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

a2a:
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  memory:
    compression-enabled: ${LISTING_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:listing-master-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

dubbo:
  application:
    name: listing-master-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22517                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20884
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}
  consumer:
    protocol: dubbo

listing:
  customer-verify:
    key-id: ${LISTING_CUSTOMER_VERIFY_KEY_ID:customer-verify-current}
    signing-secret: ${LISTING_CUSTOMER_VERIFY_SIGNING_SECRET:}
  # 产权证号 AES-256-GCM 受管加密：密钥未配置或无效时敏感写入失败关闭，不降级明文。
  private-info:
    encryption-key: ${LISTING_PRIVATE_INFO_ENCRYPTION_KEY:}
    key-id: ${LISTING_PRIVATE_INFO_KEY_ID:private-info-current}
  authorization:
    enabled: ${LISTING_AUTHORIZATION_ENABLED:false}
    audience: listing-master-service
    authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  source:
    # 2026-11-05 内部数据决定：正式业务仅使用内部 legacy-local 房源；外部 HTTP provider 已退役，
    # fixture 仅限显式隔离的测试/演示环境（SIMULATED），不作为任何故障回退。
    provider: ${LISTING_SOURCE_PROVIDER:legacy-local}
    dataset-id: ${LISTING_SOURCE_DATASET_ID:legacy-local}
    fixture-broker-id: ${LISTING_SOURCE_FIXTURE_BROKER_ID:1}
  comparison:
    report:
      storage-dir: ${LISTING_COMPARISON_STORAGE_DIR:/app/runtime/reports}
  rag:
    versioned-authorization-required: ${LISTING_RAG_VERSIONED_AUTHORIZATION_REQUIRED:false}
    key-id: ${LISTING_RAG_RPC_KEY_ID:listing-current}
    secret: ${LISTING_RAG_RPC_SECRET:}
    auth-response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
    auth-response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
    policy-version: listing-v2
    schema-version: "1"
    read-role-codes: []
    admin-role-codes: []
    dispatcher-enabled: ${LISTING_RAG_DISPATCHER_ENABLED:false}
    trusted-callers:
      agent-current:
        caller-service: agent-service
        secret: ${AGENT_RAG_RPC_SECRET:}
      customer-read-current:
        caller-service: customer-service
        secret: ${CUSTOMER_LISTING_READ_SECRET:}
      customer-inquiry-verify-current:
        caller-service: customer-service
        secret: ${CUSTOMER_LISTING_INQUIRY_VERIFY_SECRET:}
      marketing-read-current:
        caller-service: marketing-content-service
        secret: ${MARKETING_LISTING_READ_SECRET:}
      media-listing-current:
        caller-service: media-worker-service
        secret: ${MEDIA_LISTING_AUTH_SECRET:}
