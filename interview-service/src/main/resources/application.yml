server:
  port: 9014

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: interview-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
  consumer:
    protocol: dubbo
    check: false

a2a:
  memory:
    enabled: ${INTERVIEW_MEMORY_V2_ENABLED:false}
    compression-enabled: ${INTERVIEW_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${INTERVIEW_MEMORY_V2_KEY_ID:interview-memory-current}
    signing-secret: ${INTERVIEW_MEMORY_V2_SIGNING_SECRET:}
  auth:
    key-id: ${INTERVIEW_A2A_KEY_ID:interview-a2a-current}
    signing-secret: ${INTERVIEW_A2A_SIGNING_SECRET:}
    response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
    response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}
