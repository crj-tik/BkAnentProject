server:
  port: 9014

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: interview-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
  consumer:
    protocol: dubbo
    check: false

service:
  identity:
    key-id: ${SERVICE_IDENTITY_KEY_ID:interview-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

interview:
  authorization:
    enabled: ${INTERVIEW_AUTHORIZATION_ENABLED:false}
    participant-ticket-ttl-minutes: ${INTERVIEW_TICKET_TTL_MINUTES:15}
    authority-public-keys:
      auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}

a2a:
  memory:
    compression-enabled: ${INTERVIEW_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:interview-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}

# Disabled until Auth and this MCP service have reviewed keys and per-tool permissions.
mcp:
  authorization:
    server:
      enabled: false
      caller-service: agent-service
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
      caller-public-keys:
        agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
      tool-operations:
        submit_transcript: interview.asset.submit
        generate_case_report: interview.report.generate
      public-tools:
        - search_transcripts
        - get_case_report
        - grade_transcript
        - search_reports
