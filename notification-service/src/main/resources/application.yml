server:
  port: 9003

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: notification-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

a2a:
  auth:
    key-id: ${NOTIFICATION_A2A_KEY_ID:notification-a2a-current}
    signing-secret: ${NOTIFICATION_A2A_SIGNING_SECRET:}
    response-key-id: ${AUTH_RAG_RPC_RESPONSE_KEY_ID:auth-current}
    response-secret: ${AUTH_RAG_RPC_RESPONSE_SECRET:}

dubbo:
  application:
    name: notification-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22520                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20883
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}
