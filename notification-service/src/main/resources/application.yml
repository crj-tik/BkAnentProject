server:
  port: 9003

bk:
  nacos:
    server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}

spring:
  application:
    name: notification-service
  config:
    import: nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
      config:
        server-addr: ${bk.nacos.server-addr}
        namespace: ${bk.nacos.namespace}
        file-extension: yaml

service:
  identity:
    key-id: ${SERVICE_IDENTITY_KEY_ID:notification-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

a2a:
  auth:
    response-key-id: ${AUTH_SERVICE_IDENTITY_KEY_ID:auth-service-current}
    response-public-key: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
  memory:
    compression-enabled: ${NOTIFICATION_MEMORY_V2_COMPRESSION_ENABLED:false}
    key-id: ${SERVICE_IDENTITY_KEY_ID:notification-service-current}
    private-key-file: ${SERVICE_IDENTITY_PRIVATE_KEY_FILE:/run/secrets/service-identity.pem}

notification:
  authorization:
    enabled: ${NOTIFICATION_AUTHORIZATION_ENABLED:false}

dubbo:
  application:
    name: notification-service
    qos-enable: true                  # 开启QoS（默认true）
    qos-port: 22520                   # 独立端口，避免与默认22222冲突
  protocol:
    name: dubbo
    port: 20883
  registry:
    address: nacos://${bk.nacos.server-addr}?namespace=${bk.nacos.namespace}
  consumer:
    protocol: dubbo

# User calls require Auth-signed context, registered verifier keys and an exact per-tool operation mapping.
mcp:
  authorization:
    server:
      enabled: ${NOTIFICATION_MCP_AUTHORIZATION_ENABLED:false}
      caller-service: agent-service
      authority-public-keys:
        auth-service-current: ${AUTH_SERVICE_IDENTITY_PUBLIC_KEY:}
      caller-public-keys:
        agent-service-current: ${AGENT_SERVICE_IDENTITY_PUBLIC_KEY:}
      tool-operations:
        sendStationMessage: notification.message.send.all
        sendMyStationMessage: notification.message.send.own
        sendEmailMessage: notification.email.send.all
        listUserMessages: notification.message.read.own
        countUnreadMessages: notification.message.read.own
      public-tools: []
